# Configuration nginx pour artem-fr.com
#
# À adapter et intégrer dans votre configuration existante sur le serveur.
# Les trois points importants pour le référencement sont signalés ci-dessous.
#
# Après toute modification :
#     sudo nginx -t && sudo systemctl reload nginx

# ---------------------------------------------------------------------------
# 1. Table de redirection des anciennes URLs de gammes.
#
# Les pages produits sont passées de /gamme/1/Toile%20enfourneur à
# /gamme/toile-enfourneur. Sans redirection 301, le référencement acquis sur
# les anciennes URLs serait perdu et les liens externes casseraient.
#
# Le fichier redirects-gammes.map est régénéré par « npm run generate-sitemap » :
# copiez-le sur le serveur à chaque mise en production où une gamme a changé.
# ---------------------------------------------------------------------------
map $uri $gamme_redirect {
    default "";
    include /etc/nginx/conf.d/redirects-gammes.map;
}

server {
    listen 80;
    server_name artem-fr.com www.artem-fr.com;

    # Tout le trafic en HTTPS.
    return 301 https://www.artem-fr.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name artem-fr.com;

    ssl_certificate     /etc/ssl/certs/artem-fr.com.fullchain.pem;
    ssl_certificate_key /etc/ssl/private/artem-fr.com.key;

    # Une seule version canonique du domaine : le non-www redirige vers le www,
    # qui est la forme utilisée dans le sitemap et les balises canonical.
    return 301 https://www.artem-fr.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.artem-fr.com;

    # -----------------------------------------------------------------------
    # 2. Chaîne de certificats complète.
    #
    # Le serveur ne présente actuellement que le certificat final, sans le
    # certificat intermédiaire Sectigo. Les navigateurs récupèrent souvent
    # l'intermédiaire tout seuls, mais de nombreux robots et outils d'analyse
    # échouent. Utilisez le fichier « fullchain » fourni par Sectigo, qui
    # contient le certificat du site SUIVI de l'intermédiaire.
    #
    # Vérification : openssl s_client -connect www.artem-fr.com:443 \
    #                  -servername www.artem-fr.com
    # doit retourner « Verify return code: 0 (ok) ».
    # -----------------------------------------------------------------------
    ssl_certificate     /etc/ssl/certs/artem-fr.com.fullchain.pem;
    ssl_certificate_key /etc/ssl/private/artem-fr.com.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    root /var/www/artem/dist;
    index index.html;

    # Redirections 301 des anciennes URLs de gammes.
    if ($gamme_redirect != "") {
        return 301 https://www.artem-fr.com$gamme_redirect;
    }

    # Ancien chemin interne, conservé le temps que les moteurs se mettent à jour.
    location = /products {
        return 301 https://www.artem-fr.com/gamme;
    }

    # L'API tourne sur le serveur Node.
    location /api/ {
        proxy_pass         http://127.0.0.1:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Les fichiers versionnés par Vite (nom + empreinte) ne changent jamais :
    # ils peuvent être mis en cache définitivement.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(jpg|jpeg|png|gif|webp|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Ces deux fichiers sont régénérés à chaque build : pas de cache long.
    location = /sitemap.xml { expires 1h; add_header Cache-Control "public"; }
    location = /robots.txt  { expires 1h; add_header Cache-Control "public"; }

    # -----------------------------------------------------------------------
    # 3. Service des pages pré-rendues.
    #
    # « npm run build » écrit un index.html complet pour chaque page publique,
    # par exemple dist/gamme/toile-enfourneur/index.html. La directive
    # try_files sert ce fichier en priorité : le robot reçoit du HTML rempli
    # plutôt qu'une page vide. Si aucune page pré-rendue ne correspond, on
    # retombe sur l'application React, qui fait le rendu côté navigateur.
    #
    # L'ordre est important : $uri/index.html AVANT le repli /index.html.
    # -----------------------------------------------------------------------
    location / {
        try_files $uri $uri/index.html $uri/ /index.html;
    }

    # Page 404 : l'application React affiche sa propre page « Page introuvable »
    # en noindex pour toute URL inconnue.

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css text/xml application/javascript
                      application/json application/xml image/svg+xml;
}
